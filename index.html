<body>

<div id="app">

  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="返回">←</button>
    <h1 id="pageTitle">我的收藏</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
  </header>

  <main id="views">

    <!-- HOME = 收藏頁 -->
    <section id="view-home" class="view active">
      <div class="account-bar" id="accountBar">
        <div id="accSignedOut">
          <div id="googleSignInBtn"></div>
        </div>
        <div id="accSignedIn" class="hidden" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
          <div class="acc-user">
            <img id="accAvatar" src="" alt="" />
            <span class="acc-name" id="accName"></span>
          </div>
          <button id="accLogoutBtn" class="link-btn">登出</button>
        </div>
      </div>

      <div class="manual-search card">
        <div class="segmented" id="manualModeSeg">
          <button class="seg-btn active" data-mode="set">組合編號</button>
          <button class="seg-btn" data-mode="part">零件編號</button>
          <button class="seg-btn" data-mode="minifig">人偶</button>
        </div>
        <div class="search-row">
          <input id="manualInput" type="text" inputmode="text" placeholder="輸入編號或名稱，例如 75192、3001、fig-000001 或 Batman" />
          <button id="manualSearchBtn" class="pill-btn">查詢</button>
        </div>
      </div>

      <div id="collectionSignedOutHint" class="state-msg hidden">
        <div class="big">🔒</div>
        <p>請先登入 Google 帳號才能查看與新增收藏</p>
      </div>

      <div id="collectionContent">
        <div class="stats-card">
          <div class="stats-label">總價值</div>
          <div class="stats-value" id="totalValueAmount">NT$ 0</div>
          <div class="stats-sub" id="totalValueSub"></div>
        </div>

        <div class="section-head">
          <h2>我的收藏</h2>
        </div>
        <div class="collection-list" id="collectionList"></div>
        <p class="empty-hint hidden" id="collectionEmptyHint">還沒有收藏任何東西，搜尋組合、零件或人偶後按「加入收藏」吧！</p>
      </div>
    </section>

    <!-- RESULT -->
    <section id="view-result" class="view">
      <div id="resultContent"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view">
      <div class="card">
        <h2>關於</h2>
        <p class="muted">本 App 使用 Rebrickable 提供的公開資料庫與 API 查詢樂高組合、零件與人偶資訊，並使用 BrickEconomy 的價格資料估算收藏的目前價值，僅供個人記錄之用，與 LEGO® 官方、Rebrickable、BrickEconomy 皆無關聯。</p>
      </div>
    </section>

  </main>

  <!-- 加入收藏時選擇全新／二手 -->
  <div id="conditionModal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <h3>加入收藏</h3>
      <p class="muted" id="conditionModalSub"></p>
      <div class="condition-choice">
        <button class="condition-btn" data-condition="new">
          <span class="cb-icon">✨</span>
          <span class="cb-label">全新<br/>New</span>
        </button>
        <button class="condition-btn" data-condition="used">
          <span class="cb-icon">🔧</span>
          <span class="cb-label">二手<br/>Used</span>
        </button>
      </div>
      <button class="link-btn" id="conditionModalCancel">取消</button>
    </div>
  </div>

  <!-- 編輯收藏項目 -->
  <div id="editItemModal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <h3>編輯收藏</h3>
      <p class="muted" id="editItemName"></p>

      <div class="edit-row">
        <label>狀態</label>
        <div class="segmented" id="editConditionSeg">
          <button class="seg-btn" data-condition="new">全新</button>
          <button class="seg-btn" data-condition="used">二手</button>
        </div>
      </div>

      <div class="edit-row">
        <label>數量</label>
        <div class="qty-stepper">
          <button id="editQtyMinus" class="step-btn" type="button">−</button>
          <span id="editQtyValue">1</span>
          <button id="editQtyPlus" class="step-btn" type="button">＋</button>
        </div>
      </div>

      <div class="edit-row">
        <label for="editValueInput">目前價值（NT$）</label>
        <input type="number" id="editValueInput" min="0" step="1" placeholder="尚無資料" />
      </div>

      <button class="pill-btn full" id="editRefreshPriceBtn">🔄 重新查詢市場價格</button>

      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="pill-btn full" id="editSaveBtn">儲存</button>
        <button class="pill-btn full retry-btn" id="editCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
